# nginx / SWAG example for garminmcp.example.com. Adapt includes and upstream name.
#
# Two levels of exposure:
#  - paths called by claude.ai itself (from Anthropic's servers): allowed ONLY from the
#    outbound ranges Anthropic publishes (https://platform.claude.com/docs/en/api/ip-addresses).
#    Re-check that list if the connector stops working: denied requests show up as 403 in the log.
#  - paths used by a person's browser (login redirect, /my/tokens): open, optionally behind
#    your usual geo/IP filter.
# Do NOT put forward-auth (an authentication page) in front of this host: claude.ai cannot pass it.
# Do not use `if`-level geo filters at server scope: they would also block Anthropic's servers.

limit_req_zone $binary_remote_addr zone=garminmcp:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name garminmcp.example.com;

    include /config/nginx/ssl.conf;          # your TLS settings

    client_max_body_size 1m;
    limit_req zone=garminmcp burst=30 nodelay;

    # --- machine endpoints (claude.ai backend only) ---
    location ~ ^/(register|token|clients/|garmin/|health$|\.well-known/) {
        allow 160.79.104.0/21;
        allow 153.61.208.0/20;
        deny all;

        include /config/nginx/proxy.conf;    # proxy_http_version 1.1, forwarded headers...
        set $upstream http://garmin-mcp:8080;
        proxy_pass $upstream;

        # MCP stream (SSE): no buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- browser endpoints (/authorize, /oauth/*, /my/tokens) ---
    location / {
        # optional: your own geo / IP restriction here
        include /config/nginx/proxy.conf;
        set $upstream http://garmin-mcp:8080;
        proxy_pass $upstream;
    }
}
