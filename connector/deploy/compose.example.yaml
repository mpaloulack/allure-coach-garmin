# Example deployment. Adapt the hostnames and the network name to your setup.
# The container publishes NO port: only your reverse proxy (same Docker network) reaches it.
services:
  garmin-mcp:
    image: garmin-mcp:0.1          # built locally from ../Dockerfile
    pull_policy: never             # the image is not on any registry
    container_name: garmin-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777 # per-user Garmin token cache lives here, in RAM only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    environment:
      - BASE_URL=https://garminmcp.example.com
      - OIDC_REDIRECT_URI=https://garminmcp.example.com/oauth/callback
      - OIDC_DISCOVERY_URL=https://auth.example.com/application/o/mcp-garmin/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # The identity provider (a group bound to the application) is the ONLY access filter.
      # Without this flag the patched mcp-front refuses to start. See patches/allow-any-domain.patch.
      - MCP_FRONT_ALLOW_ANY_DOMAIN=true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      start_period: 15s
      interval: 30s
      retries: 3
      timeout: 5s
    networks: [proxy]
networks:
  proxy:
    external: true                 # the Docker network your reverse proxy is on
